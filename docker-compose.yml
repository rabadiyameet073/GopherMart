version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gophermart_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gophermart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./migrations/seeds/001_initial_dark_store_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gophermart"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gophermart_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gophermart_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gophermart?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: super-secret-gophermart-jwt-key-2026
      JWT_EXPIRY_HOURS: 24
      RATE_LIMIT_RPS: 20
      RATE_LIMIT_BURST: 40
      WORKER_POOL_SIZE: 5
      WORKER_QUEUE_SIZE: 100
      WORKER_MAX_RETRIES: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: gophermart_k6
    profiles:
      - test
    volumes:
      - ./tests/k6:/scripts
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

volumes:
  pgdata:
